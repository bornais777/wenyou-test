/* 自检：任何脚本错误都直接显示在页面上，附带浏览器信息，方便排查 */
(function () {
  function show(text) {
    var m = document.getElementById('boot-msg');
    if (!m) return;
    m.className = 'err';
    m.innerHTML = text + '<br><br><span style="font-size:11px;opacity:.6">浏览器：' + navigator.userAgent.replace(/</g, '&lt;') + '</span>';
  }
  window.__wenyouShowError = show;
  window.addEventListener('error', function (e) {
    show('启动出错：' + String(e.message || e).replace(/</g, '&lt;') + (e.lineno ? '（第 ' + e.lineno + ' 行）' : ''));
  });
  setTimeout(function () {
    if (document.getElementById('boot-msg') && !window.__wenyouStarted) show('启动超时：程序没有运行起来。请把这个画面截图发给 Claude。');
  }, 6000);
})();
</script>

<style>
  html, body, #root { height: 100%; margin: 0; }
  body {
    background: #070708; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  .font-serif { font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif !important; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  input:focus, textarea:focus, select:focus, button:focus { outline: none; }
  button:focus-visible, [role="button"]:focus-visible { outline: 1px solid rgba(255,255,255,.6); outline-offset: 2px; }
  select option { background: #111; color: #fff; }

  /* 背景：黑白层次，让毛玻璃看得出来 */
  .app-bg {
    background:
      radial-gradient(900px 600px at 18% 12%, rgba(255,255,255,.10), transparent 60%),
      radial-gradient(700px 500px at 85% 85%, rgba(255,255,255,.07), transparent 60%),
      linear-gradient(160deg, #141416 0%, #070708 55%, #0d0d0f 100%);
  }
  /* 毛玻璃 */
  .glass {
    background: rgba(255,255,255,.055);
    -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%);
    border: 1px solid rgba(255,255,255,.12);
  }
  .glass-strong {
    background: rgba(18,18,20,.55);
    -webkit-backdrop-filter: blur(26px) saturate(140%); backdrop-filter: blur(26px) saturate(140%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .glass-panel {
    background: rgba(12,12,14,.42);
    -webkit-backdrop-filter: blur(24px) saturate(130%); backdrop-filter: blur(24px) saturate(130%);
  }
  .modal-backdrop { -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }

  /* 中央画面占位（黑白插画感） */
  .scene {
    background:
      radial-gradient(120% 80% at 50% 0%, #2a2a2d 0%, #111113 55%, #070708 100%);
  }
  .scene::after {
    content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
  }
  .scene-moon {
    background: radial-gradient(circle at 38% 35%, #f4f4f4 0%, #bdbdbd 45%, #6b6b6b 100%);
    box-shadow: 0 0 120px 30px rgba(255,255,255,.12);
    opacity: .9;
  }
  .scene-hills {
    background:
      radial-gradient(70% 60% at 20% 100%, #1d1d20 60%, transparent 61%),
      radial-gradient(80% 55% at 80% 100%, #161618 60%, transparent 61%),
      radial-gradient(120% 45% at 50% 100%, #0c0c0d 60%, transparent 61%);
  }
  .avatar-fallback { background: linear-gradient(145deg, #3a3a3e, #121214); }

  .lamp-on { box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 0 24px rgba(255,255,255,.45); }
  .bt-on { filter: drop-shadow(0 0 6px rgba(255,255,255,.9)); }
  .caret { display: inline-block; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pop-in { animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .toast-in { animation: toast .2s ease-out; }
  @keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* 互动界面 */
  .scene-shade { background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }
  .fade-in { animation: fadein .6s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .spin { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .3; animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 30% { opacity: 1; } }
  .next-hint { animation: blink 1.1s steps(1) infinite; }
  textarea.opacity-0 { caret-color: transparent; }
  /* 世界栏：向右回弹 */
  .hud-in { animation: hudin .42s cubic-bezier(.34,1.56,.64,1); transform-origin: right center; }
  @keyframes hudin { from { opacity: 0; transform: translateX(48px) scaleX(.85); } to { opacity: 1; transform: none; } }
  .hud-out { animation: hudout .22s ease-in forwards; transform-origin: right center; }
  @keyframes hudout { to { opacity: 0; transform: translateX(48px) scaleX(.85); } }
  /* 直播 */
  .danmaku { left: 100%; animation: danmaku 8.5s linear forwards; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  @keyframes danmaku { to { transform: translateX(calc(-100vw - 100%)); } }
  .live-dot { animation: blink 1.2s steps(1) infinite; }
  .comment-fade { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px); mask-image: linear-gradient(to bottom, transparent 0, #000 10px); }
  /* 罩网 */
  .net-in { animation: fadein .5s ease-out; }
  .net-pulse { animation: netpulse 1.8s ease-out infinite; }
  @keyframes netpulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  .thin-scroll::-webkit-scrollbar { width: 6px; }
  .thin-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
  .thin-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
  input[type=number]::-webkit-inner-spin-button { opacity: .4; }

  /* 加载页 */
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: rgba(255,255,255,.6); font-size: 13px; letter-spacing: .2em; }
  #boot .t { font-family: "Songti SC","STSong","SimSun",serif; font-size: 34px; letter-spacing: .5em; padding-left: .5em; color: #fff; }
  #boot .err { max-width: 420px; letter-spacing: .02em; line-height: 1.8; text-align: center; color: rgba(255,255,255,.75); padding: 0 24px; }
/* 画面特效 */
.fx-shake{animation:fxShake .55s linear}
@keyframes fxShake{0%,100%{transform:translate(0,0) scale(1.04)}10%{transform:translate(-9px,4px) scale(1.04)}20%{transform:translate(8px,-5px) scale(1.04)}30%{transform:translate(-7px,-3px) scale(1.04)}40%{transform:translate(7px,5px) scale(1.04)}50%{transform:translate(-5px,2px) scale(1.04)}60%{transform:translate(5px,-3px) scale(1.04)}70%{transform:translate(-3px,3px) scale(1.04)}80%{transform:translate(3px,-2px) scale(1.04)}90%{transform:translate(-1px,1px) scale(1.04)}}
.fx-zoom{animation:fxZoom 2.6s ease-in-out}
@keyframes fxZoom{0%{transform:scale(1)}35%,75%{transform:scale(1.09)}100%{transform:scale(1)}}
.fx-blur{animation:fxBlur 2.2s ease-in-out}
@keyframes fxBlur{0%,100%{filter:blur(0)}25%,70%{filter:blur(7px)}}
.fx-glitch{animation:fxGlitch .9s steps(1)}
@keyframes fxGlitch{0%{transform:translate(0)}12%{transform:translate(-14px,2px);filter:invert(1)}24%{transform:translate(10px,-3px);filter:none}36%{transform:translate(-4px,0) skewX(8deg);filter:contrast(2.2)}48%{transform:translate(0);filter:invert(1)}60%{transform:translate(6px,3px);filter:none}72%{transform:translate(-8px,-2px) skewX(-6deg)}84%{transform:translate(2px);filter:contrast(1.8)}100%{transform:none;filter:none}}
.fx-flash{animation:fxFlash .6s ease-out forwards}
@keyframes fxFlash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
.fx-dark{animation:fxDark 2.4s ease-in-out forwards}
@keyframes fxDark{0%{opacity:0}20%,70%{opacity:.82}100%{opacity:0}}
.call-pulse{animation:callPulse 1.6s ease-out infinite}
@keyframes callPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}100%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
</style>
